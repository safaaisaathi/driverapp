org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# ISP-side TLS resets kill Gradle's big parallel downloads from dl.google.com
# ("Remote host terminated the handshake"); curl probes to the same artifacts
# succeed on IPv4 and IPv6 — so it's load-based, not a protocol issue.
# Make Gradle itself patient instead of failing the whole build per flake.
org.gradle.internal.repository.max.retries=10
org.gradle.internal.repository.max.tentatives=10
