name: ci

# The minimum viable CI from the driver app audit (B-14). It proves the app
# still analyzes, still tests, and still builds on a clean machine.
#
# It needs no secret. The Firebase config is compiled in from the tracked
# lib/core/config/firebase_options.dart, and the Android google-services
# plugin is not applied, so the debug APK builds without google-services.json.
#
# The release AAB and the Play upload wait for the Android flavors (B-15),
# which are deliberately after the demo.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The version in the audit: Flutter 3.47.7, Dart 3.13.5.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true

      - name: Install the packages
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

  adoption-record:
    name: adoption record does not regress
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The check reads the base commit's .contract/adopted.json, so the
          # base object has to be present in the clone.
          fetch-depth: 0

      - name: Compare the adoption record with the base
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-adoption.mjs

  build-debug-apk:
    name: build the debug apk
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          cache: true

      - name: Install the packages
        run: flutter pub get

      # Catches Gradle, manifest and Kotlin breakage that the unit tests
      # cannot see.
      - name: Build the debug APK
        run: flutter build apk --debug
